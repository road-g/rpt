<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{T}}</title><meta name="description" content="{{D}}"><link rel="canonical" href="{{CAN}}">
<meta property="og:title" content="{{T}}"><meta property="og:description" content="{{D}}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">{{ADH}}
<style>
:root{--bg:#F3F6F5;--ink:#15201C;--mu:#66736E;--ln:#D6DFDB;--ac:#0B6E4F;--acl:#E2F0EA}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif}
.ct{max-width:680px;margin:0 auto;padding:28px 20px 48px}
.hd{border-left:4px solid var(--ac);padding-left:14px;margin-bottom:22px}
.hd .nm{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hd .mu{color:var(--mu);font-size:14px;margin-top:4px}
.hl{font-size:21px;font-weight:700;line-height:1.45;margin:0 0 16px}
.kvs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.kv{background:var(--acl);border-radius:6px;padding:8px 14px}.kv span{display:block;font-size:12px;color:var(--mu)}.kv b{font-size:18px;color:var(--ac)}
ul{padding-left:20px;margin:0 0 18px}li{margin-bottom:8px}
.rk{font-size:14px;color:var(--mu);border-top:1px solid var(--ln);padding-top:12px;margin-bottom:22px}
.adw{margin:22px 0;min-height:100px}.adph{border:1px dashed var(--ln);color:var(--mu);text-align:center;padding:40px 0;font-size:13px}
.btn{display:block;width:100%;text-align:center;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:8px;font-size:17px}
.btn[aria-disabled=true]{background:#9FB3AB;pointer-events:none}
.og{font-size:13px;color:var(--mu);margin-top:8px;text-align:center}
.ft{font-size:12px;color:var(--mu);margin-top:34px;line-height:1.6}.ft a{color:var(--mu)}
a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body><main class="ct">
<div class="hd"><div class="nm">{{NM}}</div><div class="mu">{{BR}} 리포트 {{DT}}</div></div>
<h1 class="hl">{{HL}}</h1>
<div class="kvs">{{MT}}</div>
<ul>{{PTS}}</ul>
<p class="rk">리스크: {{RK}}</p>
<div class="adw">{{AD}}</div>
<a id="go" class="btn" href="{{PDF}}" rel="nofollow noopener" target="_blank" aria-disabled="true">원문 PDF 준비 중 <span id="cd">5</span>초</a>
<p class="og">원문 제목: {{TI}}</p>
<div class="adw">{{AD}}</div>
<div class="ft">요약은 AI가 원문을 재구성한 것으로 부정확할 수 있으며 투자권유가 아닙니다. 원문 저작권은 작성 증권사에 있습니다. <a href="../index.html">최신 리포트 목록</a></div>
</main><script>let n=5,c=document.getElementById("cd"),g=document.getElementById("go");const t=setInterval(()=>{n--;c.textContent=n;if(n<=0){clearInterval(t);g.removeAttribute("aria-disabled");g.textContent="원문 PDF 보기"}},1000)</script></body></html>
